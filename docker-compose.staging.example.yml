name: ${COMPOSE_PROJECT_NAME:?set an isolated fai-crm-staging-* project name}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod.example
      args:
        SECURITY_HEADERS_MODE: ${SECURITY_HEADERS_MODE:-report-only}
        SOURCE_COMMIT: ${SOURCE_COMMIT:?set the exact staging commit}
        SOURCE_TREE: ${SOURCE_TREE:?set the exact staging tree}
    image: ${APP_IMAGE:?set an immutable staging image tag containing the full commit SHA}
    env_file:
      - path: ${APP_ENV_FILE:?set a staging-only env file}
        required: true
    environment:
      NODE_ENV: production
      APP_ENV: staging
      FAI_ENVIRONMENT: staging
      FAI_ENVIRONMENT_SENTINEL: FAI_CRM_STAGING_ISOLATED_V1
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?set a staging-only database URL}
      STORAGE_PROVIDER: local
      LOCAL_DOCUMENT_STORAGE_ROOT: /var/lib/fai-crm/documents
    labels:
      it.finanzaagevolaimpresa.environment: staging
      it.finanzaagevolaimpresa.sentinel: FAI_CRM_STAGING_ISOLATED_V1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - staging_documents:/var/lib/fai-crm/documents
    ports:
      - "127.0.0.1:${APP_PORT:?set a dedicated staging port}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test \"$$FAI_ENVIRONMENT_SENTINEL\" = FAI_CRM_STAGING_ISOLATED_V1 && node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set a staging-only database name}
      POSTGRES_USER: ${POSTGRES_USER:?set a staging-only database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a staging-only database password}
    labels:
      it.finanzaagevolaimpresa.environment: staging
      it.finanzaagevolaimpresa.sentinel: FAI_CRM_STAGING_ISOLATED_V1
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  staging_postgres_data:
    labels:
      it.finanzaagevolaimpresa.environment: staging
      it.finanzaagevolaimpresa.sentinel: FAI_CRM_STAGING_ISOLATED_V1
  staging_documents:
    labels:
      it.finanzaagevolaimpresa.environment: staging
      it.finanzaagevolaimpresa.sentinel: FAI_CRM_STAGING_ISOLATED_V1

networks:
  default:
    labels:
      it.finanzaagevolaimpresa.environment: staging
      it.finanzaagevolaimpresa.sentinel: FAI_CRM_STAGING_ISOLATED_V1
