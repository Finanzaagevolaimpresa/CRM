name: M5 schema49 owner release delta
on:
  pull_request:
    paths:
      - 'scripts/m5-release/**'
      - '.github/workflows/m5-release-delta.yml'
      - 'docs/M5_RELEASE_R36.md'
permissions:
  contents: read
  actions: read
jobs:
  protocol:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -I -B -S scripts/m5-release/test_release.py
      - run: python -I -B -S scripts/m5-release/test_admission.py
      - run: python -I -B -S scripts/m5-release/test_download.py
      - name: Capture the exact generated delta
        shell: python
        run: |
          import pathlib, re, subprocess, sys
          value = subprocess.check_output([sys.executable, '-I', '-B', '-S',
              'scripts/m5-release/package_builder.py', '--delta'], text=True).strip()
          assert re.fullmatch('[a-f0-9]{64}', value)
          pathlib.Path('delta.txt').write_text(value + '\n', encoding='utf-8', newline='\n')
          print(value)
      - uses: actions/upload-artifact@v4
        with:
          name: m5-delta-${{ matrix.os }}
          path: delta.txt
          if-no-files-found: error
          retention-days: 14
  delta-parity:
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: m5-delta-*
          path: delta-inputs
      - name: Require identical Linux and Windows generated bytes
        shell: python
        run: |
          import json, pathlib, re
          values = {p.parent.name: p.read_text().strip()
              for p in pathlib.Path('delta-inputs').glob('*/delta.txt')}
          assert set(values) == {'m5-delta-ubuntu-latest', 'm5-delta-windows-latest'}
          assert all(re.fullmatch('[a-f0-9]{64}', value) for value in values.values())
          assert len(set(values.values())) == 1, 'CROSS_PLATFORM_DELTA_MISMATCH'
          result = {'protocol': 'FAI_M5_CROSS_PLATFORM_DELTA_R36', 'status': 'PASS',
              'head': '${{ github.event.pull_request.head.sha }}', 'platforms': values,
              'deltaSha256': next(iter(values.values()))}
          pathlib.Path('m5-delta-parity.json').write_text(json.dumps(result) + '\n')
          print(json.dumps(result))
      - uses: actions/upload-artifact@v4
        with:
          name: m5-release-delta-parity-${{ github.run_id }}
          path: m5-delta-parity.json
          if-no-files-found: error
          retention-days: 14
  saved-images-and-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: docker/setup-docker-action@v5
        id: docker
        with:
          version: v29.6.1
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact M5 ZIP through the generated owner downloader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Finanzaagevolaimpresa/CRM/actions/artifacts/10935172794/zip > "$RUNNER_TEMP/m5-qualified.zip"
          python3 -I -B -S scripts/m5-release/test_download.py --qualified-zip "$RUNNER_TEMP/m5-qualified.zip" qualified-m5/pr140-release-36329143320-1
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10934459652'
          run-id: '36328704625'
          repository: Finanzaagevolaimpresa/CRM
          github-token: ${{ github.token }}
          path: qualified-m4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false
      - name: Install pinned age in the disposable runner
        run: |
          GOBIN="$RUNNER_TEMP/age-bin" go install filippo.io/age/cmd/...@v1.3.2
          sudo install -m 755 "$RUNNER_TEMP/age-bin/age" "$RUNNER_TEMP/age-bin/age-keygen" /usr/local/bin/
          test "$(age --version)" = 'v1.3.2'
      - name: Qualify both schema49 backups, role provenance, age and isolated recovery
        env:
          M2_CI_DOCKER_SOCKET: ${{ steps.docker.outputs.sock }}
        run: python3 -I -B -S scripts/m5-release/qualify_delta.py qualified-m5/pr140-release-36329143320-1/release-images.tar.gz qualified-m4/pr140-release-36328704625-1/release-images.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-release-delta-${{ github.run_id }}
          path: m5-release-ci-receipt.json
          if-no-files-found: error
          retention-days: 14
