name: M3 schema48 owner release delta
on:
  pull_request:
    paths:
      - 'scripts/m3-release/**'
      - '.github/workflows/m3-release-delta.yml'
      - 'docs/M3_RELEASE_R32.md'
permissions:
  contents: read
  actions: read
jobs:
  protocol:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -I -B -S scripts/m3-release/test_release.py
      - run: python -I -B -S scripts/m3-release/package_builder.py --delta
  saved-images-and-schema48:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: docker/setup-docker-action@v5
        id: docker
        with:
          version: v29.6.1
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10919540739'
          run-id: '36281830361'
          repository: Finanzaagevolaimpresa/CRM
          github-token: ${{ github.token }}
          path: qualified-m3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false
      - name: Install pinned age in the disposable CI runner
        run: |
          GOBIN="$RUNNER_TEMP/age-bin" go install filippo.io/age/cmd/...@v1.3.2
          sudo install -m 755 "$RUNNER_TEMP/age-bin/age" "$RUNNER_TEMP/age-bin/age-keygen" /usr/local/bin/
          test "$(age --version)" = 'v1.3.2'
      - name: Qualify saved M3 images, schema48 backup, age and isolated restore
        env:
          M2_CI_DOCKER_SOCKET: ${{ steps.docker.outputs.sock }}
        run: python3 -I -B -S scripts/m3-release/qualify_delta.py qualified-m3/pr140-release-36281830361-1/release-images.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-release-delta-${{ github.run_id }}
          path: m3-release-ci-receipt.json
          if-no-files-found: error
          retention-days: 14
