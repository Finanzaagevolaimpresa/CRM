name: R05 M1 account access
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  account-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        privileged_mode: [enforced, disabled]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: synthetic-m1, POSTGRES_DB: fai_crm_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d fai_crm_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-m1@127.0.0.1:5432/fai_crm_test?schema=public
      APP_ENV: test
      NODE_ENV: development
      INTERNAL_SESSION_MODE: registry
      PRIVILEGED_ACCESS_MODE: ${{ matrix.privileged_mode }}
      PRIVILEGED_STEP_UP_KEY_VERSION: "1"
      LOGIN_THROTTLE_MODE: disabled
      SECURITY_HEADERS_MODE: report-only
      APP_ORIGIN: http://127.0.0.1:3015
      AUTH_SECRET: synthetic-account-browser-authentication-only
      AUTH_COOKIE_NAME: fai_m1_browser_session
      RUN_DB_TESTS: "1"
      AI_ORCHESTRATOR_DB_TESTS_CONFIRMED: "1"
      AI_ORCHESTRATOR_DB_TEST_SENTINEL: FAI_CRM_EPHEMERAL_TEST_ONLY_V1
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", persist-credentials: false }
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Prepare isolated database
        run: |
          psql 'postgresql://postgres:synthetic-m1@127.0.0.1:5432/fai_crm_test' -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE fai_crm_test IS 'FAI_CRM_EPHEMERAL_TEST_ONLY_V1'"
          npm run prisma:migrate:deploy
      - name: PostgreSQL account and login concurrency tests
        if: matrix.privileged_mode == 'enforced'
        run: node --import tsx --test --test-concurrency=1 tests/db/user-account-db.test.ts tests/db/manual-assignment-db.test.ts tests/db/user-continuity-db.test.ts tests/client-read-perimeter-db.test.ts tests/commercial-origin-db.test.ts tests/responsibility-db.test.ts tests/purchased-service-handoff-db.test.ts
      - name: Generate ephemeral browser inputs
        shell: bash
        run: |
          for name in M1_BROWSER_PASSWORD M1_BROWSER_UPDATED_PASSWORD PRIVILEGED_STEP_UP_SECRET; do
            value=$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: npx playwright install --with-deps chromium
      - name: Account browser qualification
        run: npx playwright test --config tests/user-account-browser/playwright.config.ts --reporter=line
