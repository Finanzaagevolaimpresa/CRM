name: PR140 release qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/pr140-release/**'
      - 'tests/practice-readiness-browser/**'
      - 'tests/dashboard-browser/**'
      - 'scripts/pr140/**'
      - 'scripts/calendar-perimeter/**'
      - 'tests/personal-calendar/return-state.ts'
      - 'scripts/r05/**'
      - 'prisma/**'
      - 'Dockerfile.prod.example'
      - '.github/workflows/pr140-release-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/pr140-release/**'
      - 'tests/practice-readiness-browser/**'
      - 'tests/dashboard-browser/**'
      - 'scripts/pr140/**'
      - 'scripts/calendar-perimeter/**'
      - 'tests/personal-calendar/return-state.ts'
      - 'scripts/r05/**'
      - 'prisma/**'
      - 'Dockerfile.prod.example'
      - '.github/workflows/pr140-release-qualification.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: pr140-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release-schema71:
    name: Schema71 reminders and earlier state retained on restart
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CALENDAR_RETURN_ARTIFACT_DIR: ${{ runner.temp }}/calendar-return-pr263
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - name: Install locked qualification tools
        run: npm ci && npx playwright install --with-deps chromium
      - name: Download the exact qualified PR263 image artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '15197050184'
          run-id: '45994851134'
          repository: Finanzaagevolaimpresa/CRM
          github-token: ${{ github.token }}
          path: ${{ env.CALENDAR_RETURN_ARTIFACT_DIR }}
          merge-multiple: true
      - name: Verify exact source and owner preflight syntax
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          bash -n scripts/pr140/qualify-release.sh
          bash -n scripts/calendar-perimeter/qualify-return.sh
          node --import tsx tests/personal-calendar/return-state.ts self-test
          python3 -c "from pathlib import Path; p=Path('scripts/pr140/owner-preflight.py'); compile(p.read_text(), str(p), 'exec')"
      - name: Verify candidate, M1 access controls and compatible application restart
        run: bash scripts/pr140/qualify-release.sh
      - name: Save minimized receipts and qualified image archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr140-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.R05_EVIDENCE_DIR }}/release-receipt.json
            ${{ env.R05_EVIDENCE_DIR }}/*-summary.json
            ${{ env.R05_EVIDENCE_DIR }}/admission.json
            ${{ env.R05_EVIDENCE_DIR }}/*-recovery.json
            ${{ env.R05_EVIDENCE_DIR }}/*-epochs.json
            ${{ env.R05_EVIDENCE_DIR }}/after-resume.json
            ${{ env.R05_EVIDENCE_DIR }}/shared-fixture.json
            ${{ env.R05_EVIDENCE_DIR }}/*session-revocation.json
            ${{ env.R05_EVIDENCE_DIR }}/selective-*.png
            ${{ env.R05_EVIDENCE_DIR }}/release-images.tar.gz
          if-no-files-found: error
          retention-days: 14
