name: M1 owner capability

on:
  pull_request:
    paths:
      - 'scripts/m1-executor/**'
      - 'docs/M1_OWNER_EXECUTOR.md'
      - 'docs/M1_OWNER_FILE_CHANNEL.md'
      - '.github/workflows/m1-owner-executor.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/m1-executor/**'
      - 'docs/M1_OWNER_EXECUTOR.md'
      - 'docs/M1_OWNER_FILE_CHANNEL.md'
      - '.github/workflows/m1-owner-executor.yml'

permissions:
  contents: read

jobs:
  windows-capability:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Synthetic observer, ACL, input, package and stdio boundaries
        shell: powershell
        run: ./scripts/m1-executor/Test-M1Executor.ps1
      - name: File transport admission, replay, crash recovery and filesystem boundaries
        shell: powershell
        run: |
          ./scripts/m1-executor/Test-FileChannel.ps1
          python -I -B -S ./scripts/m1-executor/test_file_channel_client.py
          if ($LASTEXITCODE -ne 0) { throw 'FILE_CHANNEL_CLIENT_TESTS_FAILED' }
