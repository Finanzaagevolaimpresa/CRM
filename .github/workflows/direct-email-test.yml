name: Direct email diagnostic qualification
on: [pull_request]
permissions: { contents: read }
concurrency:
  group: direct-email-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: synthetic-direct-only, POSTGRES_DB: fai_crm_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d fai_crm_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-direct-only@127.0.0.1:5432/fai_crm_test?schema=public
      APP_ENV: test
      NODE_ENV: development
      RUN_DB_TESTS: '1'
      AI_ORCHESTRATOR_DB_TESTS_CONFIRMED: '1'
      AI_ORCHESTRATOR_DB_TEST_SENTINEL: FAI_CRM_EPHEMERAL_TEST_ONLY_V1
      DIRECT_EMAIL_DB_CONFIRMED: '1'
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Guarded synthetic database and SMTP fake; no external transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          psql 'postgresql://postgres:synthetic-direct-only@127.0.0.1:5432/fai_crm_test' -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE fai_crm_test IS 'FAI_CRM_EPHEMERAL_TEST_ONLY_V1'"
          npm run prisma:migrate:deploy
          node --import tsx --test tests/direct-email-test.test.ts tests/direct-email/service-db.test.ts | tee "$RUNNER_TEMP/direct-email.tap"
          grep -Eq '^# pass [1-9][0-9]*$' "$RUNNER_TEMP/direct-email.tap"
          grep -Fx '# fail 0' "$RUNNER_TEMP/direct-email.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/direct-email.tap"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-email-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-email.tap
          if-no-files-found: error
          retention-days: 14
