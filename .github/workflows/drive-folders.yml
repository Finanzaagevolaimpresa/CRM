name: Selective client Drive folders
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: drive-folders-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qualify:
    name: Drive folders ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [database, browser]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-folders-only
          POSTGRES_DB: fai_crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d fai_crm_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-folders-only@127.0.0.1:5432/fai_crm_test?schema=public
      APP_ENV: test
      NODE_ENV: development
      RUN_DB_TESTS: '1'
      DRIVE_FOLDER_DB_TESTS: '1'
      AI_ORCHESTRATOR_DB_TESTS_CONFIRMED: '1'
      AI_ORCHESTRATOR_DB_TEST_SENTINEL: FAI_CRM_EPHEMERAL_TEST_ONLY_V1
      INTERNAL_SESSION_MODE: registry
      AUTH_SECRET: synthetic-folder-auth-only-0000000000000000000
      AUTH_COOKIE_NAME: fai_folders_test_session
      LOGIN_THROTTLE_MODE: disabled
      SECURITY_HEADERS_MODE: report-only
      APP_ORIGIN: http://127.0.0.1:3051
      PRIVILEGED_ACCESS_MODE: enforced
      PRIVILEGED_STEP_UP_KEY_VERSION: '1'
      PRIVILEGED_STEP_UP_SECRET: synthetic-folder-step-up-only-0000000000000000
      COMMERCIAL_LEAD_INBOX_MODE: disabled
      FOLDER_BROWSER_CONFIRMED: '1'
      FOLDER_BROWSER_PASSWORD: synthetic-folder-browser-password-000000000000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Exact candidate and unchanged isolated schema75
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          node scripts/m4/verify-schema.mjs
          echo "FOLDER_EVIDENCE=$RUNNER_TEMP/drive-folders" >> "$GITHUB_ENV"
          echo "LOCAL_DOCUMENT_STORAGE_ROOT=$RUNNER_TEMP/drive-folders/files" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/drive-folders"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/drive-folders/source.txt"
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE fai_crm_test IS 'FAI_CRM_EPHEMERAL_TEST_ONLY_V1'"
          npm run prisma:migrate:deploy
          test "$(psql "${DATABASE_URL%%\?*}" -Atc 'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')" = 75
      - name: Native reference lifecycle, immutable audit and isolation
        if: matrix.target == 'database'
        run: |
          set -euo pipefail
          node --import tsx --test --test-concurrency=1 --test-reporter=tap tests/drive-folders-db.test.ts | tee "$FOLDER_EVIDENCE/native.tap"
          grep -Fx '# tests 18' "$FOLDER_EVIDENCE/native.tap"
          grep -Fx '# pass 18' "$FOLDER_EVIDENCE/native.tap"
          grep -Fx '# skipped 0' "$FOLDER_EVIDENCE/native.tap"
      - name: Synthetic UI fixture and supported local runner
        if: matrix.target == 'browser'
        run: |
          node --import tsx tests/drive-folders/provision-browser.ts
          npx playwright install --with-deps chromium
          npx next dev --webpack --hostname 127.0.0.1 --port 3051 > "$FOLDER_EVIDENCE/next.log" 2>&1 &
          echo $! > "$FOLDER_EVIDENCE/next.pid"
          for i in $(seq 1 120); do
            if curl --max-time 5 -fsS http://127.0.0.1:3051/login >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Real browser actions on synthetic accounts, no external navigation
        if: matrix.target == 'browser'
        run: |
          npx playwright test --config tests/drive-folders/playwright.config.ts
          node -e "const r=require(process.env.FOLDER_EVIDENCE+'/playwright.json'); if(r.stats.expected!==2 || r.stats.unexpected || r.stats.skipped || r.stats.flaky) process.exit(1)"
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-folders-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/drive-folders
          retention-days: 14
