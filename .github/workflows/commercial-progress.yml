name: Commercial progress perimeter
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: commercial-progress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qualify:
    name: Commercial progress ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [postgresql, browser]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: synthetic-progress-only, POSTGRES_DB: fai_crm_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d fai_crm_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-progress-only@127.0.0.1:5432/fai_crm_test?schema=public
      APP_ENV: test
      NODE_ENV: development
      RUN_DB_TESTS: '1'
      AI_ORCHESTRATOR_DB_TESTS_CONFIRMED: '1'
      AI_ORCHESTRATOR_DB_TEST_SENTINEL: FAI_CRM_EPHEMERAL_TEST_ONLY_V1
      INTERNAL_SESSION_MODE: registry
      AUTH_SECRET: synthetic-progress-auth-only
      AUTH_COOKIE_NAME: fai_progress_session
      LOGIN_THROTTLE_MODE: disabled
      SECURITY_HEADERS_MODE: report-only
      APP_ORIGIN: http://127.0.0.1:3048
      COMMERCIAL_PROGRESS_BROWSER_CONFIRMED: '1'
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Bind candidate and guarded synthetic database
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          node scripts/m4/verify-schema.mjs
          evidence="$RUNNER_TEMP/commercial-progress-evidence"
          mkdir -p "$evidence"
          echo "COMMERCIAL_PROGRESS_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE fai_crm_test IS 'FAI_CRM_EPHEMERAL_TEST_ONLY_V1'"
          npm run prisma:migrate:deploy
          test "$(psql "${DATABASE_URL%%\?*}" -Atc 'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')" = 65
      - name: Positive and negative current-perimeter PostgreSQL tests
        if: matrix.target == 'postgresql'
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test --test-reporter=tap --test-concurrency=1 tests/commercial-progress-db.test.ts | tee "$COMMERCIAL_PROGRESS_EVIDENCE/postgresql.tap"
          grep -q '^# tests 6$' "$COMMERCIAL_PROGRESS_EVIDENCE/postgresql.tap"
          grep -q '^# pass 6$' "$COMMERCIAL_PROGRESS_EVIDENCE/postgresql.tap"
          grep -q '^# skipped 0$' "$COMMERCIAL_PROGRESS_EVIDENCE/postgresql.tap"
      - name: Native browser and responsive UI
        if: matrix.target == 'browser'
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run dev -- --hostname 127.0.0.1 --port 3048 > "$COMMERCIAL_PROGRESS_EVIDENCE/app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3048/api/health >/dev/null; then ready=1; break; fi
            kill -0 "$app_pid"
            sleep 1
          done
          test "$ready" = 1
          PLAYWRIGHT_JSON_OUTPUT_NAME="$COMMERCIAL_PROGRESS_EVIDENCE/playwright.json" npx playwright test --config tests/commercial-progress-browser/playwright.config.ts --reporter=line,json | tee "$COMMERCIAL_PROGRESS_EVIDENCE/browser.log"
          node -e 'const r=require(process.env.COMMERCIAL_PROGRESS_EVIDENCE+"/playwright.json"); if(r.stats.expected!==5 || r.stats.unexpected!==0 || r.stats.skipped!==0 || r.stats.flaky!==0) process.exit(1)'
      - name: Bind evidence and verify tracked source remains exact
        run: |
          git rev-parse HEAD HEAD^{tree} > "$COMMERCIAL_PROGRESS_EVIDENCE/source.txt"
          node -e 'const fs=require("node:fs"), assert=require("node:assert/strict"), cp=require("node:child_process"); const original=cp.execFileSync("git",["show","HEAD:next-env.d.ts"],{encoding:"utf8"}); assert([original,original.replaceAll("./.next/types/","./.next/dev/types/")].includes(fs.readFileSync("next-env.d.ts","utf8")))'
          git diff --exit-code -- . ':(exclude)next-env.d.ts'
          git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-progress-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/commercial-progress-evidence
          if-no-files-found: error
          retention-days: 14
