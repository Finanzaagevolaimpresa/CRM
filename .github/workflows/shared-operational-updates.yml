name: Shared operational updates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: shared-operational-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qualify:
    name: Shared operational ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [migration-postgresql, browser]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-shared-only
          POSTGRES_DB: fai_crm_test
        ports: ['127.0.0.1:15476:5432']
        options: >-
          --label fai.scope=shared-operational-synthetic
          --health-cmd="pg_isready -h 127.0.0.1 -U postgres -d fai_crm_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-shared-only@127.0.0.1:15476/fai_crm_test?schema=public
      APP_ENV: test
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      RUN_DB_TESTS: '1'
      RUN_SHARED_OPERATIONAL_DB_TESTS: '1'
      AI_ORCHESTRATOR_DB_TESTS_CONFIRMED: '1'
      AI_ORCHESTRATOR_DB_TEST_SENTINEL: FAI_CRM_EPHEMERAL_TEST_ONLY_V1
      INTERNAL_SESSION_MODE: registry
      PRIVILEGED_ACCESS_MODE: enforced
      PRIVILEGED_STEP_UP_KEY_VERSION: '1'
      PRIVILEGED_STEP_UP_SECRET: synthetic-shared-step-up-000000000000
      AUTH_SECRET: synthetic-shared-auth-000000000000
      AUTH_COOKIE_NAME: fai_shared_test_session
      COMMERCIAL_LEAD_INBOX_MODE: disabled
      LOGIN_THROTTLE_MODE: disabled
      SECURITY_HEADERS_MODE: report-only
      APP_ORIGIN: http://127.0.0.1:3060
      SHARED_BROWSER_CONFIRMED: '1'
      SHARED_BROWSER_PASSWORD: synthetic-shared-browser-password-0000000000
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Bind exact candidate and synthetic target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          node scripts/m4/verify-schema.mjs
          evidence="$RUNNER_TEMP/shared-evidence"
          mkdir "$evidence"
          echo "SHARED_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "LOCAL_DOCUMENT_STORAGE_ROOT=$RUNNER_TEMP/shared-documents" >> "$GITHUB_ENV"
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE fai_crm_test IS 'FAI_CRM_EPHEMERAL_TEST_ONLY_V1'"
      - name: Schema75 preservation, injected rollback, schema76 and exact backup restore
        if: matrix.target == 'migration-postgresql'
        run: python3 scripts/shared-operational/qualify-migration.py --container '${{ job.services.postgres.id }}' --out "$SHARED_EVIDENCE/migration"
      - name: Strict payloads, atomic writes, authorization, concurrency and persistent outcome
        if: matrix.target == 'migration-postgresql'
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test --test-reporter=tap tests/shared-operational-update-contract.test.ts | tee "$SHARED_EVIDENCE/unit.tap"
          grep -q '^# tests 8$' "$SHARED_EVIDENCE/unit.tap"
          grep -q '^# pass 8$' "$SHARED_EVIDENCE/unit.tap"
          grep -q '^# skipped 0$' "$SHARED_EVIDENCE/unit.tap"
          node --import tsx --test --test-reporter=tap --test-concurrency=1 tests/shared-operational-updates-db.test.ts | tee "$SHARED_EVIDENCE/database.tap"
          grep -q '^# tests 22$' "$SHARED_EVIDENCE/database.tap"
          grep -q '^# pass 22$' "$SHARED_EVIDENCE/database.tap"
          grep -q '^# skipped 0$' "$SHARED_EVIDENCE/database.tap"
      - name: Prepare native browser fixture through the current registry
        if: matrix.target == 'browser'
        run: |
          npm run prisma:migrate:deploy
          npx playwright install --with-deps chromium
          node --import tsx tests/shared-operational/provision-browser.ts
      - name: Ordinary login, three views, measured latency, revoked draft and lost response
        if: matrix.target == 'browser'
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next dev --turbopack --hostname 127.0.0.1 --port 3060 > "$SHARED_EVIDENCE/app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 150); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:3060/api/health >/dev/null; then ready=1; break; fi
            kill -0 "$app_pid"
            sleep 1
          done
          test "$ready" = 1
          PLAYWRIGHT_JSON_OUTPUT_NAME="$SHARED_EVIDENCE/playwright.json" npx playwright test --config tests/shared-operational/playwright.config.ts --reporter=line,json --output "$SHARED_EVIDENCE/test-results" | tee "$SHARED_EVIDENCE/browser.log"
          node -e 'const r=require(process.env.SHARED_EVIDENCE+"/playwright.json"); if(r.stats.expected!==5 || r.stats.unexpected!==0 || r.stats.skipped!==0) process.exit(1)'
      - name: Bind results to exact source
        run: |
          git rev-parse HEAD HEAD^{tree} > "$SHARED_EVIDENCE/source.txt"
          node -e 'const fs=require("node:fs"), a=require("node:assert/strict"), cp=require("node:child_process"); const original=cp.execFileSync("git",["show","HEAD:next-env.d.ts"],{encoding:"utf8"}); a([original,original.replaceAll("./.next/types/","./.next/dev/types/")].includes(fs.readFileSync("next-env.d.ts","utf8")))'
          git diff --exit-code -- . ':(exclude)next-env.d.ts'
          git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-operational-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/shared-evidence
          if-no-files-found: error
          retention-days: 14
