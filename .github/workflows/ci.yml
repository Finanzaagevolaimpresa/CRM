    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare tracked-only source worktree
        working-directory: .
        run: |
          test ! -e ../vnx00a-tracked
          git worktree add --detach ../vnx00a-tracked HEAD
          test "$(git -C ../vnx00a-tracked rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install exact npm audit client
        timeout-minutes: 3
        run: |
          npm install --global npm@11.16.0 --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund --fetch-retries=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=3000 --fetch-timeout=30000
          test "$(npm --version)" = "11.16.0"

      - name: Verify dependency audit gate fail-closed controls
        run: node --import tsx --test tests/npm-audit-gate.test.ts

      - name: Verify dependency audits
        id: dependency-audit
        timeout-minutes: 12
        run: node --import tsx scripts/npm-audit-gate.ts

      - name: Report minimal public npm advisory diagnostics
        if: ${{ always() && steps.dependency-audit.outcome == 'failure' }}
        timeout-minutes: 3
        run: |
          reports="$(mktemp -d)"
          trap 'rm -rf "$reports"' EXIT
          for scope in runtime complete; do
            scope_args=(--include=prod --include=optional --include=peer)
            if [[ "$scope" == runtime ]]; then
              scope_args+=(--omit=dev)
            else
              scope_args+=(--include=dev)
            fi
            npm audit "${scope_args[@]}" \
              --audit-level=low --json --registry=https://registry.npmjs.org/ \
              --offline=false --prefer-online=true --fetch-retries=0 --fetch-timeout=30000 \
              > "$reports/$scope.json" || true
            node --import tsx scripts/npm-audit-public-diagnostics.ts \
              "$reports/$scope.json" package-lock.json "$scope"
          done

      - name: Verify patch and shell syntax
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "$BASE_SHA"...HEAD
          fi
          bash -n scripts/smoke-docker-prod.sh
          bash -n scripts/backup-docker-prod.sh scripts/n05/*.sh scripts/vnx03/*.sh

      - name: Verify legacy production resources resolve as external
        env:
          COMPOSE_PROJECT_NAME: fai-crm
          APP_ENV_FILE: .env.production.example
          APP_IMAGE: fai-crm:pr95-af402f143d9a
          SOURCE_COMMIT: af402f143d9ad3533c32c1ebd8a03593b412e672
          SOURCE_TREE: 7e0543c7045a1ad7ad3670dd8d4b01983d09e7ed
          POSTGRES_IMAGE: postgres:16-alpine
          POSTGRES_DB: fai_crm_ci
          POSTGRES_USER: fai_crm_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        run: |
          docker compose \
            -p fai-crm \
            --env-file .env.production.example \
            -f docker-compose.prod.example.yml \
            -f docker-compose.prod.legacy-resources.yml \
            config --quiet
          docker compose \
            -p fai-crm \
            --env-file .env.production.example \
            -f docker-compose.prod.example.yml \
            -f docker-compose.prod.legacy-resources.yml \
            config > /tmp/n05-legacy-compose.yml
          test "$(grep -c 'external: true' /tmp/n05-legacy-compose.yml)" = "3"
          grep -Fq 'name: fai-crm_postgres_data' /tmp/n05-legacy-compose.yml
          grep -Fq 'name: fai-crm_crm_documents' /tmp/n05-legacy-compose.yml
          grep -Fq 'name: fai-crm_default' /tmp/n05-legacy-compose.yml

      - name: Verify PR82 has no schema or migration delta
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/ai-orchestrator-admission-claim-lease-wiring-v1'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          migration_count="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          test "$migration_count" = "29"
          if git diff --name-only "$BASE_SHA"...HEAD -- prisma/schema.prisma prisma/migrations | grep -q .; then
            echo "PR82 must not change prisma/schema.prisma or prisma/migrations" >&2
            exit 1
          fi

      - name: Verify VNX-01 has exactly 43 migrations and no schema delta
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/vnx01-lead-intake-operational-bridge-r01'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_RECOVERY_BASE_SHA: 22a5dda14cc3b69ea1e35909ab4d5e9a1201a15b
        run: |
          migration_count="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          test "$migration_count" = "43"
          if git diff --name-only "$BASE_SHA"...HEAD -- prisma/schema.prisma prisma/migrations | grep -q .; then
            echo "VNX-01 must not change prisma/schema.prisma or prisma/migrations" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$CI_RECOVERY_BASE_SHA" HEAD; then
            echo "VNX-01 CI recovery base is not an ancestor of HEAD" >&2
            exit 1
          fi
          if git diff --name-only "$CI_RECOVERY_BASE_SHA"..HEAD -- package.json package-lock.json | grep -q .; then
            echo "VNX-01 CI recovery must not change package.json or package-lock.json" >&2
            exit 1
          fi

      - name: Verify VNX-02 has exactly 43 migrations and no CRM runtime delta
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/vnx02-wordpress-secure-lead-connector'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          migration_count="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          test "$migration_count" = "43"
          if git diff --name-only "$BASE_SHA"...HEAD -- prisma/schema.prisma prisma/migrations src/app src/lib docker-compose.prod.example.yml .env.production.example .env.staging.example .env.example | grep -q .; then
            echo "VNX-02 must not change Prisma, CRM runtime, Compose, or CRM environment surfaces" >&2
            exit 1
          fi

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Verify VNX-02 PHP runtime and syntax
        run: |
          php -r 'foreach (["curl", "intl", "json", "mbstring", "mysqli", "sodium"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "VNX02_PHP_EXTENSION_MISSING\n"); exit(1); } }'
          find integrations/wordpress/fai-secure-lead-connector tests/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test VNX-02 WordPress connector
        run: |
          npm run test:wordpress-connector
          php tests/php/vnx02-wordpress-queue-mysql.test.php

      - name: Package VNX-02 WordPress connector
        run: |
          npm run package:wordpress-connector
          unzip -t dist/fai-secure-lead-connector-1.0.0.zip

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Apply exactly 44 database migrations
        run: |
          current_prisma="$PWD/node_modules/.bin/prisma"
          historical_source="$RUNNER_TEMP/pr137-general-schema44"
          git worktree add --detach "$historical_source" c49b18ccc4df713e212e8e4f2f05100638aee317
          test "$(git -C "$historical_source" rev-parse HEAD^{tree})" = 064415e3dbb4a7d4ac1498c24808a01342de2359
          (cd "$historical_source" && "$current_prisma" migrate deploy --schema prisma/schema.prisma)
          git worktree remove --force "$historical_source"

      - name: Bind ephemeral database sentinel
        run: |
          printf '%s\n' \
            "COMMENT ON DATABASE fai_crm_test IS 'FAI_CRM_EPHEMERAL_TEST_ONLY_V1';" \
            | npx prisma db execute --stdin --schema prisma/schema.prisma

      - name: Verify production seed idempotency
        run: |
          APP_ENV=production npm run prisma:seed:production
          APP_ENV=production npm run prisma:seed:production

      - name: Verify DB tests skip without DATABASE_URL
        run: env -u DATABASE_URL npm run test:db

      - name: Run PostgreSQL integration tests
        run: RUN_DB_TESTS=1 AI_ORCHESTRATOR_DB_TESTS_CONFIRMED=1 AI_ORCHESTRATOR_DB_TEST_SENTINEL=FAI_CRM_EPHEMERAL_TEST_ONLY_V1 npm run test:db

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify systemd unit examples
        run: |
          if command -v systemd-analyze >/dev/null 2>&1; then
            root="$(mktemp -d)"
            mkdir -p "$root/etc/systemd/system" "$root/usr/bin"
            cp deploy/systemd/fai-crm-ai-reconcile.service.example "$root/etc/systemd/system/fai-crm-ai-reconcile.service"
            cp deploy/systemd/fai-crm-ai-reconcile.timer.example "$root/etc/systemd/system/fai-crm-ai-reconcile.timer"
            for unit in network-online.target sysinit.target timers.target; do
              printf '[Unit]\nDescription=Dummy %%s for verify\n' "$unit" > "$root/etc/systemd/system/$unit"
            done
            printf '[Unit]\nDescription=Dummy docker.service for verify\n[Service]\nExecStart=/usr/bin/true\n' > "$root/etc/systemd/system/docker.service"
            : > "$root/usr/bin/docker"
            chmod +x "$root/usr/bin/docker"
            systemd-analyze verify --root="$root" fai-crm-ai-reconcile.service fai-crm-ai-reconcile.timer
            rm -rf "$root"
          else
            echo "systemd-analyze not available; skipping unit verification"
          fi

      - name: Docker production application and worker packaging smoke test — historical schema44
        run: |
          historical_source="$RUNNER_TEMP/pr137-smoke-schema44"
          git worktree add --detach "$historical_source" c49b18ccc4df713e212e8e4f2f05100638aee317
          test "$(git -C "$historical_source" rev-parse HEAD^{tree})" = 064415e3dbb4a7d4ac1498c24808a01342de2359
          (cd "$historical_source" && COMPOSE_PROJECT_NAME=fai-crm-smoke-${{ github.run_id }}-${{ github.run_attempt }} ./scripts/smoke-docker-prod.sh)
          git worktree remove --force "$historical_source"

      - name: VNX-05 scoped consumer PostgreSQL qualification in the packaged application
        env:
          VNX05_SYNTHETIC_TESTS_CONFIRMED: "1"
        run: |
          historical_source="$RUNNER_TEMP/pr137-vnx05-schema44"
          git worktree add --detach "$historical_source" c49b18ccc4df713e212e8e4f2f05100638aee317
          test "$(git -C "$historical_source" rev-parse HEAD^{tree})" = 064415e3dbb4a7d4ac1498c24808a01342de2359
          test "$(git -C "$historical_source" ls-tree -d --name-only HEAD:prisma/migrations | wc -l | tr -d ' ')" = "44"
          (cd "$historical_source" && bash -n scripts/vnx05/packaging-smoke.sh && bash scripts/vnx05/packaging-smoke.sh)
          git worktree remove --force "$historical_source"

      - name: Run isolated staging read-only preflight
        run: |
          staging_root="$(mktemp -d /tmp/fai-crm-n05-staging.XXXXXX)"
          cleanup_staging_env() {
            find "$staging_root" -depth -mindepth 1 -delete
            rmdir "$staging_root"
          }
          trap cleanup_staging_env EXIT
          staging_env="$staging_root/.env.staging"
          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          project="fai-crm-staging-ci-${{ github.run_id }}"
          origin="https://staging-ci.example.test"
          image="fai-crm:staging-$source_commit"
          sed \
            -e "s#fai-crm-staging-example#$project#g" \
            -e "s#https://staging.invalid#$origin#g" \
            -e "s#fai-crm:staging-<full-commit-sha>#$image#g" \
            -e "s#<full-commit-sha>#$source_commit#g" \
            -e "s#<full-tree-sha>#$source_tree#g" \
            -e "s#APP_ENV_FILE=\".env.staging\"#APP_ENV_FILE=\"$staging_env\"#g" \
            -e "s#<staging-only-random-password>#synthetic-staging-ci-password#g" \
            -e "s#<staging-only-random-secret-at-least-32-bytes>#synthetic-staging-ci-auth-secret-0001#g" \
            .env.staging.example > "$staging_env"
          chmod 600 "$staging_env"
          FAI_ENVIRONMENT=staging \
          FAI_ENVIRONMENT_SENTINEL=FAI_CRM_STAGING_ISOLATED_V1 \
          COMPOSE_PROJECT_NAME="$project" \
          COMPOSE_FILE="$PWD/docker-compose.staging.example.yml" \
          ENV_FILE="$staging_env" \
          APP_ORIGIN="$origin" \
          APP_IMAGE="$image" \
          EXPECTED_DATABASE_NAME=fai_crm_staging \
          EXPECTED_DATABASE_USER=fai_crm_staging \
          EXPECTED_SOURCE_COMMIT="$source_commit" \
          EXPECTED_SOURCE_TREE="$source_tree" \
          STAGING_EXPECT_ABSENT=true \
            ./scripts/n05/staging-preflight.sh

      - name: N05 synthetic backup, full restore and N-1 rollback drill
        run: |
          current_node_bin="$PWD/node_modules/.bin"
          historical_source="$RUNNER_TEMP/pr137-n05-schema44"
          git worktree add --detach "$historical_source" c49b18ccc4df713e212e8e4f2f05100638aee317
          test "$(git -C "$historical_source" rev-parse HEAD^{tree})" = 064415e3dbb4a7d4ac1498c24808a01342de2359
          rollback_commit=71d238b27efde1afb708e25d0fe035c0c69dc303
          rollback_tree="$(git rev-parse "$rollback_commit^{tree}")"
          rollback_migration_count="$(git ls-tree -d --name-only "$rollback_commit:prisma/migrations" | wc -l | tr -d ' ')"
          (cd "$historical_source" && \
            PATH="$current_node_bin:$PATH" \
            ROLLBACK_COMMIT="$rollback_commit" \
            ROLLBACK_TREE="$rollback_tree" \
            EXPECTED_MIGRATION_COUNT=44 \
            EXPECTED_ROLLBACK_MIGRATION_COUNT="$rollback_migration_count" \
            N05_RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}" \
              npm run test:n05:restore)
          git worktree remove --force "$historical_source"

      - name: Remove tracked-only source worktree
        if: always()
        working-directory: .
        run: git worktree remove --force ../vnx00a-tracked

  n05-persistent-key-mounts:
    name: N05 same-image persistent key mounts and rollback
    needs: build-context-guard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify N05 source and synthetic validators
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git ls-tree -d --name-only c49b18ccc4df713e212e8e4f2f05100638aee317:prisma/migrations | wc -l | tr -d ' ')" = "44"
          python3 -B tests/n05/test_key_mounts.py
          bash -n scripts/n05/reconfigure-production-keys.sh

      - name: Qualify actual Compose freeze, app recreation and restoration
        env:
          N05_SYNTHETIC_KEYS_CONFIRMED: "1"
          N05_SYNTHETIC_APP_IMAGE: fai-crm:n05-keys-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if docker image inspect "$N05_SYNTHETIC_APP_IMAGE" >/dev/null 2>&1; then
            echo 'N05 synthetic image already exists' >&2
            exit 1
          fi
          image_source=18c8bf252cca9d6f1ff369e3d4f69149ef462f69
          image_context="$(mktemp -d /tmp/fai-crm-vnx04-image.XXXXXX)"
          cleanup_image() {
            docker image rm "$N05_SYNTHETIC_APP_IMAGE" >/dev/null
            find "$image_context" -depth -mindepth 1 -delete
            rmdir "$image_context"
          }
          trap cleanup_image EXIT
          docker pull postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          git archive "$image_source" | tar -x -C "$image_context"
          docker build --build-arg SOURCE_COMMIT="$image_source" \
            --build-arg SOURCE_TREE="$(git rev-parse "$image_source^{tree}")" \
            -f "$image_context/Dockerfile.prod.example" -t "$N05_SYNTHETIC_APP_IMAGE" "$image_context"
          python3 -B tests/n05/key_mounts_drill.py

  n05-failed-app-return:
    name: N05 failed-app controlled return
    needs: build-context-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact N05 source head and Compose app-only flags
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          docker compose up --help | grep -F -- '--no-start'
          docker compose up --help | grep -F -- '--no-deps'
          docker compose up --help | grep -F -- '--no-build'
          docker compose up --help | grep -F -- '--pull'
      - name: Protocol tests, canonical lock and production pre-daemon guard
        env:
          N05_TEST_CANONICAL_LOCK: "1"
        run: |
          test ! -e /run/fai-crm-n05
          sudo mkdir -m 0700 /run/fai-crm-n05
          sudo chown "$(id -u):$(id -g)" /run/fai-crm-n05
          trap 'rm -f /run/fai-crm-n05/n05-failed-app-return.lock; sudo rmdir /run/fai-crm-n05' EXIT
          python3 -B -m unittest -v tests/n05/test_failed_app_return.py
          python3 -B tests/n05/test_failed_app_deadlines.py
          python3 -B tests/n05/test_postgres_user_metadata.py
      - name: Real Docker synthetic return and persistence drill
        env:
          N05_FAILED_RETURN_SYNTHETIC_CONFIRMED: "1"
        run: |
          docker pull alpine:3.20
          docker pull postgres:16-alpine
          python3 -B tests/n05/failed_app_return_drill.py

  vnx03-wpforms-https-e2e:
    name: VNX-03 authentic WPForms HTTPS end-to-end
    needs: build-context-guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VNX03_BASE_SHA: 71d238b27efde1afb708e25d0fe035c0c69dc303
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: c49b18ccc4df713e212e8e4f2f05100638aee317
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source head and protected scope
        run: |
          test "$(git rev-parse HEAD)" = "c49b18ccc4df713e212e8e4f2f05100638aee317"
          test "$(git rev-parse HEAD^{tree})" = "064415e3dbb4a7d4ac1498c24808a01342de2359"
          bash scripts/vnx03/verify-protected-scope.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked test dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify fail-closed harness preflight
        run: |
          bash -n scripts/vnx03/run-e2e.sh tests/vnx03/init-materials.sh tests/vnx03/wordpress-entrypoint.sh
          set +e
          preflight_output="$(bash scripts/vnx03/run-e2e.sh --preflight-only 2>&1)"
          preflight_status=$?
          set -e
          test "$preflight_status" -ne 0
          grep -Fq 'VNX03_SYNTHETIC_CONFIRMATION_MISSING' <<<"$preflight_output"
          VNX03_SYNTHETIC_E2E_CONFIRMED=1 bash scripts/vnx03/run-e2e.sh --preflight-only

      - name: Run isolated authentic WPForms qualification
        env:
          VNX03_SYNTHETIC_E2E_CONFIRMED: "1"
          VNX03_EVIDENCE_DIR: ${{ runner.temp }}/vnx03-evidence
        run: npm run test:vnx03:e2e

      - name: Upload sanitized VNX-03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnx03-synthetic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vnx03-evidence
          if-no-files-found: error
          retention-days: 14

  n05-recovery-kit:
    name: N05 encrypted transfer and isolated recovery
    needs: build-context-guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify recovery scope and syntax
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          bash -n scripts/backup-docker-prod.sh scripts/n05/backup-compose.sh tests/n05/run-recovery-drill.sh
          python3 -B tests/n05/test_recovery_kit.py

      - name: Qualify real N05, age, pinned SSH and isolated recovery
        env:
          N05_RECOVERY_SYNTHETIC_CONFIRMED: "1"
          N05_RECOVERY_RUNNER_IMAGE: fai-crm:recovery-runner-${{ github.run_id }}-${{ github.run_attempt }}
          N05_RECOVERY_APP_IMAGE: fai-crm:recovery-source-${{ github.run_id }}-${{ github.run_attempt }}
          N05_RECOVERY_POSTGRES_IMAGE: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          N05_RECOVERY_DOCUMENT_HELPER_IMAGE: node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
        run: |
          for image in "$N05_RECOVERY_RUNNER_IMAGE" "$N05_RECOVERY_APP_IMAGE"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              echo 'Synthetic image destination already occupied' >&2
              exit 1
            fi
          done
          context="$(mktemp -d /tmp/fai-crm-n05-recovery-image.XXXXXX)"
          cleanup_images() {
            for image in "$N05_RECOVERY_RUNNER_IMAGE" "$N05_RECOVERY_APP_IMAGE"; do
              if docker image inspect "$image" >/dev/null 2>&1; then
                docker image rm "$image" >/dev/null || return 1
              fi
            done
            test -d "$context" && test ! -L "$context"
            find "$context" -depth -mindepth 1 -delete
            rmdir "$context"
          }
          trap cleanup_images EXIT
          image_source=ff71b130d2476d77329c07bd492c95c6782162ca
          git -c core.autocrlf=false archive "$image_source" -- .dockerignore Dockerfile.prod.example package.json package-lock.json \
            prisma next-env.d.ts next.config.ts postcss.config.js tailwind.config.ts tsconfig.json public scripts src \
            | tar -xf - -C "$context"
          docker pull "$N05_RECOVERY_POSTGRES_IMAGE"
          docker pull "$N05_RECOVERY_DOCUMENT_HELPER_IMAGE"
          docker build --build-arg SOURCE_COMMIT="$image_source" \
            --build-arg SOURCE_TREE="$(git rev-parse "$image_source^{tree}")" \
            -f "$context/Dockerfile.prod.example" -t "$N05_RECOVERY_APP_IMAGE" "$context"
          docker build -f tests/n05/recovery-runner.Dockerfile -t "$N05_RECOVERY_RUNNER_IMAGE" tests/n05
          bash tests/n05/run-recovery-drill.sh
