name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-context-guard:
    name: Protect tracked-only Docker build context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Test build context guard
        run: node --test tests/vnx00a-build-context-guard.test.mjs

      - name: Run build context guard
        run: node scripts/vnx00a-build-context-guard.mjs

  validate:
    name: Validate, test and package
    needs: build-context-guard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ../vnx00a-tracked
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fai_crm_test?schema=public
      AUTH_SECRET: ci-only-secret-change-me
      AUTH_COOKIE_NAME: fai_crm_session
      INTERNAL_SESSION_MODE: legacy
      PRIVILEGED_ACCESS_MODE: disabled
      LOGIN_THROTTLE_MODE: disabled
      LOGIN_THROTTLE_MAX_FAILURES: "5"
      LOGIN_THROTTLE_WINDOW_SECONDS: "900"
      LOGIN_THROTTLE_BLOCK_SECONDS: "900"
      SECURITY_HEADERS_MODE: report-only
      APP_ORIGIN: http://localhost:3000
      FEATURE_INTEGRATIONS_ENABLED: "false"
      FEATURE_CUSTOMER_PORTAL_ENABLED: "false"
      FEATURE_PAYMENTS_ENABLED: "false"
      FEATURE_AI_WORKER_ENABLED: "false"
      FEATURE_AI_DISPATCH_ENABLED: "false"
      FEATURE_AI_EGRESS_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      AI_PROVIDER: mock
      AI_ORCHESTRATOR_WORKER_ENABLED: "0"
      AI_EXTERNAL_PROVIDERS_ENABLED: "false"
      AI_ALLOWED_MODELS: ""
      SECURE_LEAD_GATEWAY_MODE: disabled
      SECURE_LEAD_GATEWAY_KEYRING_FILE: ""
      VNX01_LEAD_INTAKE_CONSUMER_ENABLED: "0"
      VNX01_LEAD_INTAKE_LEASE_OWNER_ID: ""
      VNX01_LEAD_INTAKE_BATCH_SIZE: ""
      VNX01_LEAD_INTAKE_RECOVERY_BATCH_SIZE: ""
      LEAD_IDENTITY_KEY_FILE: ""
      COMMERCIAL_LEAD_INBOX_MODE: disabled
      VNX02_MYSQL_TESTS_CONFIRMED: "1"
      VNX02_MYSQL_HOST: 127.0.0.1
      VNX02_MYSQL_PORT: "3306"
      VNX02_MYSQL_DATABASE: fai_vnx02_test
      VNX02_MYSQL_USER: fai_vnx02_test
      VNX02_MYSQL_PASSWORD: synthetic-vnx02-password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fai_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fai_crm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-root-password
          MYSQL_DATABASE: fai_vnx02_test
          MYSQL_USER: fai_vnx02_test
          MYSQL_PASSWORD: synthetic-vnx02-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -psynthetic-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare tracked-only source worktree
        working-directory: .
        run: |
          test ! -e ../vnx00a-tracked
          git worktree add --detach ../vnx00a-tracked HEAD
          test "$(git -C ../vnx00a-tracked rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install exact npm audit client
        timeout-minutes: 3
        run: |
          npm install --global npm@11.16.0 --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund --fetch-retries=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=3000 --fetch-timeout=30000
          test "$(npm --version)" = "11.16.0"

      - name: Verify dependency audit gate fail-closed controls
        run: node --import tsx --test tests/npm-audit-gate.test.ts

      - name: Verify dependency audits
        timeout-minutes: 12
        run: node --import tsx scripts/npm-audit-gate.ts

      - name: Verify patch and shell syntax
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "$BASE_SHA"...HEAD
          fi
          bash -n scripts/smoke-docker-prod.sh
          bash -n scripts/backup-docker-prod.sh scripts/n05/*.sh

      - name: Verify legacy production resources resolve as external
        env:
          COMPOSE_PROJECT_NAME: fai-crm
          APP_ENV_FILE: .env.production.example
          APP_IMAGE: fai-crm:pr95-af402f143d9a
          SOURCE_COMMIT: af402f143d9ad3533c32c1ebd8a03593b412e672
          SOURCE_TREE: 7e0543c7045a1ad7ad3670dd8d4b01983d09e7ed
          POSTGRES_IMAGE: postgres:16-alpine
          POSTGRES_DB: fai_crm_ci
          POSTGRES_USER: fai_crm_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        run: |
          docker compose \
            -p fai-crm \
            --env-file .env.production.example \
            -f docker-compose.prod.example.yml \
            -f docker-compose.prod.legacy-resources.yml \
            config --quiet
          docker compose \
            -p fai-crm \
            --env-file .env.production.example \
            -f docker-compose.prod.example.yml \
            -f docker-compose.prod.legacy-resources.yml \
            config > /tmp/n05-legacy-compose.yml
          test "$(grep -c 'external: true' /tmp/n05-legacy-compose.yml)" = "3"
          grep -Fq 'name: fai-crm_postgres_data' /tmp/n05-legacy-compose.yml
          grep -Fq 'name: fai-crm_crm_documents' /tmp/n05-legacy-compose.yml
          grep -Fq 'name: fai-crm_default' /tmp/n05-legacy-compose.yml

      - name: Verify PR82 has no schema or migration delta
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/ai-orchestrator-admission-claim-lease-wiring-v1'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          migration_count="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          test "$migration_count" = "29"
          if git diff --name-only "$BASE_SHA"...HEAD -- prisma/schema.prisma prisma/migrations | grep -q .; then
            echo "PR82 must not change prisma/schema.prisma or prisma/migrations" >&2
            exit 1
          fi

      - name: Verify VNX-01 has exactly 43 migrations and no schema delta
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/vnx01-lead-intake-operational-bridge-r01'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_RECOVERY_BASE_SHA: 22a5dda14cc3b69ea1e35909ab4d5e9a1201a15b
        run: |
          migration_count="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          test "$migration_count" = "43"
          if git diff --name-only "$BASE_SHA"...HEAD -- prisma/schema.prisma prisma/migrations | grep -q .; then
            echo "VNX-01 must not change prisma/schema.prisma or prisma/migrations" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$CI_RECOVERY_BASE_SHA" HEAD; then
            echo "VNX-01 CI recovery base is not an ancestor of HEAD" >&2
            exit 1
          fi
          if git diff --name-only "$CI_RECOVERY_BASE_SHA"..HEAD -- package.json package-lock.json | grep -q .; then
            echo "VNX-01 CI recovery must not change package.json or package-lock.json" >&2
            exit 1
          fi

      - name: Verify VNX-02 has exactly 43 migrations and no CRM runtime delta
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/vnx02-wordpress-secure-lead-connector'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          migration_count="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          test "$migration_count" = "43"
          if git diff --name-only "$BASE_SHA"...HEAD -- prisma/schema.prisma prisma/migrations src/app src/lib docker-compose.prod.example.yml .env.production.example .env.staging.example .env.example | grep -q .; then
            echo "VNX-02 must not change Prisma, CRM runtime, Compose, or CRM environment surfaces" >&2
            exit 1
          fi

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Verify VNX-02 PHP runtime and syntax
        run: |
          php -r 'foreach (["curl", "intl", "json", "mbstring", "mysqli", "sodium"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "VNX02_PHP_EXTENSION_MISSING\n"); exit(1); } }'
          find integrations/wordpress/fai-secure-lead-connector tests/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test VNX-02 WordPress connector
        run: |
          npm run test:wordpress-connector
          php tests/php/vnx02-wordpress-queue-mysql.test.php

      - name: Package VNX-02 WordPress connector
        run: |
          npm run package:wordpress-connector
          unzip -t dist/fai-secure-lead-connector-1.0.0.zip

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Apply exactly 43 database migrations
        run: |
          test "$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "43"
          npm run prisma:migrate:deploy

      - name: Bind ephemeral database sentinel
        run: |
          printf '%s\n' \
            "COMMENT ON DATABASE fai_crm_test IS 'FAI_CRM_EPHEMERAL_TEST_ONLY_V1';" \
            | npx prisma db execute --stdin --schema prisma/schema.prisma

      - name: Verify production seed idempotency
        run: |
          APP_ENV=production npm run prisma:seed:production
          APP_ENV=production npm run prisma:seed:production

      - name: Verify DB tests skip without DATABASE_URL
        run: env -u DATABASE_URL npm run test:db

      - name: Run PostgreSQL integration tests
        run: RUN_DB_TESTS=1 AI_ORCHESTRATOR_DB_TESTS_CONFIRMED=1 AI_ORCHESTRATOR_DB_TEST_SENTINEL=FAI_CRM_EPHEMERAL_TEST_ONLY_V1 npm run test:db

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify systemd unit examples
        run: |
          if command -v systemd-analyze >/dev/null 2>&1; then
            root="$(mktemp -d)"
            mkdir -p "$root/etc/systemd/system" "$root/usr/bin"
            cp deploy/systemd/fai-crm-ai-reconcile.service.example "$root/etc/systemd/system/fai-crm-ai-reconcile.service"
            cp deploy/systemd/fai-crm-ai-reconcile.timer.example "$root/etc/systemd/system/fai-crm-ai-reconcile.timer"
            for unit in network-online.target sysinit.target timers.target; do
              printf '[Unit]\nDescription=Dummy %%s for verify\n' "$unit" > "$root/etc/systemd/system/$unit"
            done
            printf '[Unit]\nDescription=Dummy docker.service for verify\n[Service]\nExecStart=/usr/bin/true\n' > "$root/etc/systemd/system/docker.service"
            : > "$root/usr/bin/docker"
            chmod +x "$root/usr/bin/docker"
            systemd-analyze verify --root="$root" fai-crm-ai-reconcile.service fai-crm-ai-reconcile.timer
            rm -rf "$root"
          else
            echo "systemd-analyze not available; skipping unit verification"
          fi

      - name: Docker production application and worker packaging smoke test
        run: COMPOSE_PROJECT_NAME=fai-crm-smoke-${{ github.run_id }}-${{ github.run_attempt }} ./scripts/smoke-docker-prod.sh

      - name: Run isolated staging read-only preflight
        run: |
          staging_root="$(mktemp -d /tmp/fai-crm-n05-staging.XXXXXX)"
          cleanup_staging_env() {
            find "$staging_root" -depth -mindepth 1 -delete
            rmdir "$staging_root"
          }
          trap cleanup_staging_env EXIT
          staging_env="$staging_root/.env.staging"
          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          project="fai-crm-staging-ci-${{ github.run_id }}"
          origin="https://staging-ci.example.test"
          image="fai-crm:staging-$source_commit"
          sed \
            -e "s#fai-crm-staging-example#$project#g" \
            -e "s#https://staging.invalid#$origin#g" \
            -e "s#fai-crm:staging-<full-commit-sha>#$image#g" \
            -e "s#<full-commit-sha>#$source_commit#g" \
            -e "s#<full-tree-sha>#$source_tree#g" \
            -e "s#APP_ENV_FILE=\".env.staging\"#APP_ENV_FILE=\"$staging_env\"#g" \
            -e "s#<staging-only-random-password>#synthetic-staging-ci-password#g" \
            -e "s#<staging-only-random-secret-at-least-32-bytes>#synthetic-staging-ci-auth-secret-0001#g" \
            .env.staging.example > "$staging_env"
          chmod 600 "$staging_env"
          FAI_ENVIRONMENT=staging \
          FAI_ENVIRONMENT_SENTINEL=FAI_CRM_STAGING_ISOLATED_V1 \
          COMPOSE_PROJECT_NAME="$project" \
          COMPOSE_FILE="$PWD/docker-compose.staging.example.yml" \
          ENV_FILE="$staging_env" \
          APP_ORIGIN="$origin" \
          APP_IMAGE="$image" \
          EXPECTED_DATABASE_NAME=fai_crm_staging \
          EXPECTED_DATABASE_USER=fai_crm_staging \
          EXPECTED_SOURCE_COMMIT="$source_commit" \
          EXPECTED_SOURCE_TREE="$source_tree" \
          STAGING_EXPECT_ABSENT=true \
            ./scripts/n05/staging-preflight.sh

      - name: N05 synthetic backup, full restore and N-1 rollback drill
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            rollback_commit="$PR_BASE_SHA"
          else
            rollback_commit="$(git rev-parse HEAD^1)"
          fi
          rollback_tree="$(git rev-parse "$rollback_commit^{tree}")"
          ROLLBACK_COMMIT="$rollback_commit" \
          ROLLBACK_TREE="$rollback_tree" \
          EXPECTED_MIGRATION_COUNT=43 \
          N05_RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}" \
            npm run test:n05:restore

      - name: Remove tracked-only source worktree
        if: always()
        working-directory: .
        run: git worktree remove --force ../vnx00a-tracked

  vnx03-wpforms-https-e2e:
    name: VNX-03 authentic WPForms HTTPS end-to-end
    needs: build-context-guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VNX03_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source head and protected scope
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "43"
          if [[ -n "$VNX03_BASE_SHA" ]] \
            && git cat-file -e "$VNX03_BASE_SHA^{commit}" 2>/dev/null \
            && git diff --name-only "$VNX03_BASE_SHA"...HEAD -- \
              tests/vnx03 tests/vnx03-e2e-harness.test.ts scripts/vnx03 \
              docs/vnx03-wpforms-https-end-to-end-qualification-r01.md \
              | grep -q .; then
            if git diff --name-only "$VNX03_BASE_SHA"...HEAD -- \
              prisma/schema.prisma prisma/migrations src \
              Dockerfile.prod.example docker-compose.prod.example.yml \
              .env.example .env.production.example .env.staging.example \
              | grep -q .; then
              echo "VNX-03 must not change CRM runtime, Prisma, migrations, or production configuration" >&2
              exit 1
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked test dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify fail-closed harness preflight
        run: |
          bash -n scripts/vnx03/run-e2e.sh tests/vnx03/init-materials.sh tests/vnx03/wordpress-entrypoint.sh
          set +e
          preflight_output="$(bash scripts/vnx03/run-e2e.sh --preflight-only 2>&1)"
          preflight_status=$?
          set -e
          test "$preflight_status" -ne 0
          grep -Fq 'VNX03_SYNTHETIC_CONFIRMATION_MISSING' <<<"$preflight_output"
          VNX03_SYNTHETIC_E2E_CONFIRMED=1 bash scripts/vnx03/run-e2e.sh --preflight-only

      - name: Run isolated authentic WPForms qualification
        env:
          VNX03_SYNTHETIC_E2E_CONFIRMED: "1"
          VNX03_EVIDENCE_DIR: ${{ runner.temp }}/vnx03-evidence
        run: npm run test:vnx03:e2e

      - name: Upload sanitized VNX-03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnx03-synthetic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vnx03-evidence
          if-no-files-found: error
          retention-days: 14
