  n15-assignment-browser:
    name: N15 synthetic assignment and authorized consultation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-n15-browser
          POSTGRES_DB: fai_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fai_crm_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-n15-browser@127.0.0.1:5432/fai_crm_test?schema=public
      APP_ENV: test
      NODE_ENV: development
      AUTH_SECRET: synthetic-n15-browser-auth-secret
      AUTH_COOKIE_NAME: fai_n15_browser_session
      INTERNAL_SESSION_MODE: registry
      PRIVILEGED_ACCESS_MODE: enforced
      PRIVILEGED_STEP_UP_KEY_VERSION: "1"
      LOGIN_THROTTLE_MODE: disabled
      SECURITY_HEADERS_MODE: report-only
      APP_ORIGIN: http://127.0.0.1:3000
      COMMERCIAL_LEAD_INBOX_MODE: enforced
      N15_SYNTHETIC_ASSIGNMENT_OPT_IN: N15_SYNTHETIC_ASSIGNMENT_V1
      RUN_DB_TESTS: "1"
      AI_ORCHESTRATOR_DB_TESTS_CONFIRMED: "1"
      AI_ORCHESTRATOR_DB_TEST_SENTINEL: FAI_CRM_EPHEMERAL_TEST_ONLY_V1
      N15_BROWSER_SYNTHETIC_CONFIRMED: "1"
      FEATURE_INTEGRATIONS_ENABLED: "false"
      FEATURE_CUSTOMER_PORTAL_ENABLED: "false"
      FEATURE_PAYMENTS_ENABLED: "false"
      FEATURE_AI_WORKER_ENABLED: "false"
      FEATURE_AI_DISPATCH_ENABLED: "false"
      FEATURE_AI_EGRESS_ENABLED: "false"
      AI_PROVIDER: mock
      AI_ORCHESTRATOR_WORKER_ENABLED: "0"
      AI_EXTERNAL_PROVIDERS_ENABLED: "false"
      AI_ALLOWED_MODELS: ""
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: c49b18ccc4df713e212e8e4f2f05100638aee317
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source head and unchanged migration chain
        run: |
          test "$(git rev-parse HEAD)" = "c49b18ccc4df713e212e8e4f2f05100638aee317"
          test "$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "44"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare ephemeral PostgreSQL and synthetic authorities
        run: |
          N15_BROWSER_EVIDENCE_DIR="$RUNNER_TEMP/n15-browser-evidence"
          export N15_BROWSER_EVIDENCE_DIR
          printf 'N15_BROWSER_EVIDENCE_DIR=%s\n' "$N15_BROWSER_EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$N15_BROWSER_EVIDENCE_DIR"
          PRIVILEGED_STEP_UP_SECRET="$(openssl rand -base64 36 | tr -d '\n')"
          N15_BROWSER_PASSWORD="$(openssl rand -base64 36 | tr -d '\n')"
          export PRIVILEGED_STEP_UP_SECRET N15_BROWSER_PASSWORD
          echo "::add-mask::$PRIVILEGED_STEP_UP_SECRET"
          echo "::add-mask::$N15_BROWSER_PASSWORD"
          printf 'PRIVILEGED_STEP_UP_SECRET=%s\n' "$PRIVILEGED_STEP_UP_SECRET" >> "$GITHUB_ENV"
          printf 'N15_BROWSER_PASSWORD=%s\n' "$N15_BROWSER_PASSWORD" >> "$GITHUB_ENV"
          psql 'postgresql://postgres:synthetic-n15-browser@127.0.0.1:5432/fai_crm_test' \
            -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE fai_crm_test IS 'FAI_CRM_EPHEMERAL_TEST_ONLY_V1'"
          npm run prisma:migrate:deploy
          test "$(psql 'postgresql://postgres:synthetic-n15-browser@127.0.0.1:5432/fai_crm_test' -Atc 'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')" = 44
          node --import tsx tests/n15-browser/provision.ts
          printf '{"phase":"provisioned","synthetic":true,"migrations":44}\n' \
            > "$N15_BROWSER_EVIDENCE_DIR/provision.json"
      - name: Run real assignment and consultation browser path
        run: |
          mkdir -p "$N15_BROWSER_EVIDENCE_DIR"
          npm run dev > "${RUNNER_TEMP}/n15-browser-app.log" 2>&1 &
          app_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            node tests/n15-browser/write-runtime-diagnostic.mjs \
              "${RUNNER_TEMP}/n15-browser-app.log" \
              "$N15_BROWSER_EVIDENCE_DIR/runtime-diagnostic.json"
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          server_ready=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              set +e
              wait "$app_pid"
              server_status=$?
              set -e
              node tests/n15-browser/write-startup-diagnostic.mjs \
                "${RUNNER_TEMP}/n15-browser-app.log" \
                "$N15_BROWSER_EVIDENCE_DIR/startup-diagnostic.json" EARLY_EXIT "$server_status"
              echo N15_BROWSER_APP_EARLY_EXIT >&2
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/api/health >/dev/null; then
              server_ready=1
              break
            fi
            sleep 1
          done
          if [[ "$server_ready" != "1" ]]; then
            node tests/n15-browser/write-startup-diagnostic.mjs \
              "${RUNNER_TEMP}/n15-browser-app.log" \
              "$N15_BROWSER_EVIDENCE_DIR/startup-diagnostic.json" HEALTH_TIMEOUT unknown
            echo N15_BROWSER_APP_UNAVAILABLE >&2
            exit 1
          fi
          node tests/n15-browser/write-startup-diagnostic.mjs \
            "${RUNNER_TEMP}/n15-browser-app.log" \
            "$N15_BROWSER_EVIDENCE_DIR/startup-diagnostic.json" READY unknown
          npx playwright test --config tests/n15-browser/playwright.config.ts
      - name: Upload minimized N15 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n15-assignment-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n15-browser-evidence
          if-no-files-found: error
          retention-days: 14

  mobile-navigation:
    name: Mobile navigation browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Measure baseline and candidate navigation shells
        env:
          MOBILE_NAV_BASELINE_SHA: 75d6fd42d16aa9edd3655d37bd1af4d9e1d80b07
          MOBILE_NAV_BASELINE_TREE: a66c2588972bf39fad8ed32e25597de06822bf87
          MOBILE_NAV_EVIDENCE_DIR: ${{ runner.temp }}/mobile-nav-evidence
        run: |
          baseline_root="$(mktemp -d /tmp/fai-crm-mobile-baseline.XXXXXX)"
          cleanup() {
            git worktree remove --force "$baseline_root" 2>/dev/null || true
            test ! -e "$baseline_root" || rm -rf "$baseline_root"
          }
          trap cleanup EXIT
          git worktree add --detach "$baseline_root" "$MOBILE_NAV_BASELINE_SHA"
          test "$(git -C "$baseline_root" rev-parse HEAD)" = "$MOBILE_NAV_BASELINE_SHA"
          test "$(git -C "$baseline_root" rev-parse HEAD^{tree})" = "$MOBILE_NAV_BASELINE_TREE"
          mkdir -p "$baseline_root/tests/mobile-nav"
          cp -R tests/mobile-nav/fixture "$baseline_root/tests/mobile-nav/fixture"
          # Shared synthetic content; the historical navigation shell stays unchanged.
          cp src/components/dashboard-overview.tsx "$baseline_root/src/components/dashboard-overview.tsx"
          cp src/lib/dashboard-counter-groups.ts "$baseline_root/src/lib/dashboard-counter-groups.ts"
          cp -a "$PWD/node_modules" "$baseline_root/node_modules"
          node tests/mobile-nav/measure-navigation.mjs "$baseline_root" baseline "$MOBILE_NAV_EVIDENCE_DIR" 3418
          node tests/mobile-nav/measure-navigation.mjs "$PWD" candidate "$MOBILE_NAV_EVIDENCE_DIR" 3419
          printf '%s\n' \
            "baseline_commit=$MOBILE_NAV_BASELINE_SHA" \
            "baseline_tree=$MOBILE_NAV_BASELINE_TREE" \
            "candidate_commit=$(git rev-parse HEAD)" \
            "candidate_tree=$(git rev-parse HEAD^{tree})" \
            > "$MOBILE_NAV_EVIDENCE_DIR/source-identities.txt"
      - name: Run mobile navigation browser checks
        run: npm run test:mobile-nav
      - name: Upload synthetic navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-navigation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mobile-nav-evidence
            test-results/mobile-nav
          if-no-files-found: error
          retention-days: 14

