name: Technical assignments
on:
  pull_request:
    paths: ['src/lib/rome-date-time.ts', 'src/lib/operational-time.ts', 'src/components/rome-date-time-input.tsx', 'src/components/ui.tsx', 'tests/rome-date-time.test.ts', 'src/components/user-removal-form.tsx', 'tests/user-account-browser/**', 'package.json', 'package-lock.json', 'prisma/**', 'ops/technical-assignment-authority-enrollment.sql', 'scripts/technical-assignments/**', 'src/lib/technical-*', 'src/lib/selective-*.ts', 'src/lib/privileged-access.ts', 'src/components/technical-*', 'src/app/technical-work/**', 'src/app/technical-office/**', 'src/app/projects/**', 'src/app/search/**', 'tests/technical-assignment*', 'tests/technical-assignments/**', 'tests/technical-work*', 'docs/TECHNICAL_ASSIGNMENTS*', '.github/workflows/technical-assignments.yml']
permissions: { contents: read }
concurrency:
  group: technical-assignments-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  postgresql:
    name: Technical assignments ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: { target: [postgresql, browser, enrollment] }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: synthetic-technical-only, POSTGRES_DB: fai_crm_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d fai_crm_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-technical-only@127.0.0.1:5432/fai_crm_test?schema=public
      APP_ENV: test
      NODE_ENV: development
      RUN_DB_TESTS: '1'
      RUN_TECHNICAL_ASSIGNMENT_DB_TESTS: '1'
      AI_ORCHESTRATOR_DB_TESTS_CONFIRMED: '1'
      AI_ORCHESTRATOR_DB_TEST_SENTINEL: FAI_CRM_EPHEMERAL_TEST_ONLY_V1
      INTERNAL_SESSION_MODE: registry
      AUTH_SECRET: synthetic-technical-auth-only-000000000
      AUTH_COOKIE_NAME: fai_technical_test_session
      PRIVILEGED_ACCESS_MODE: enforced
      PRIVILEGED_STEP_UP_KEY_VERSION: '1'
      PRIVILEGED_STEP_UP_SECRET: synthetic-technical-step-up-000000000000
      COMMERCIAL_LEAD_INBOX_MODE: disabled
      LOGIN_THROTTLE_MODE: disabled
      SECURITY_HEADERS_MODE: report-only
      APP_ORIGIN: http://127.0.0.1:3052
      TECHNICAL_BROWSER_CONFIRMED: '1'
      TECHNICAL_BROWSER_PASSWORD: synthetic-technical-password-000000000
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Qualify migration64 from isolated schema63
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          evidence="$RUNNER_TEMP/technical-assignments"
          mkdir -p "$evidence"
          echo "TECHNICAL_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/technical-private-documents"
          echo "LOCAL_DOCUMENT_STORAGE_ROOT=$RUNNER_TEMP/technical-private-documents" >> "$GITHUB_ENV"
          node scripts/m4/verify-schema.mjs > "$evidence/current-schema71-binding.json"
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE fai_crm_test IS 'FAI_CRM_EPHEMERAL_TEST_ONLY_V1'"
          historical="$RUNNER_TEMP/technical-schema63"
          mkdir -p "$historical"
          git archive d6a5a3d14a9b3a1ade0d33e6b156ad71da5d9b0f prisma | tar -x -C "$historical"
          npx prisma migrate deploy --schema "$historical/prisma/schema.prisma"
          if psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -f prisma/migrations/20261022200000_technical_assignments_v1/migration.sql > "$evidence/wrong-base.log" 2>&1; then exit 1; fi
          grep -Fq TECHNICAL_ASSIGNMENT_SCHEMA63_REQUIRED "$evidence/wrong-base.log"
          test "$(psql "${DATABASE_URL%%\?*}" -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('TechnicalAssignmentAuthority','TechnicalAssignment','TechnicalAssignmentDecision','TechnicalAssignmentRevision','TechnicalWorkCommand')")" = 0
          git archive 3a43977b585a9af43e4ef0c489841ce9a699a2c3 prisma | tar -x -C "$historical"
          npx prisma migrate deploy --schema "$historical/prisma/schema.prisma"
          bash scripts/technical-assignments/qualify-migration.sh
          if [ "${{ matrix.target }}" != enrollment ]; then bash scripts/admin-requests/qualify-migration.sh; npx prisma migrate deploy; fi
      - name: Operator-only enrollment, denials, concurrent single use and atomic audit
        if: matrix.target == 'enrollment'
        env: { RUN_TECHNICAL_ENROLLMENT_TESTS: '1' }
        run: python3 scripts/technical-assignments/qualify-enrollment.py
      - name: Actual PostgreSQL admission, exact mutation, concurrency, replay and atomic audit
        if: matrix.target == 'postgresql'
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test --test-reporter=tap tests/technical-assignment-access-db.test.ts | tee "$TECHNICAL_EVIDENCE/postgresql.tap"
          grep -Fx '# tests 22' "$TECHNICAL_EVIDENCE/postgresql.tap"
          grep -Fx '# pass 22' "$TECHNICAL_EVIDENCE/postgresql.tap"
          grep -Fx '# fail 0' "$TECHNICAL_EVIDENCE/postgresql.tap"
          grep -Fx '# skipped 0' "$TECHNICAL_EVIDENCE/postgresql.tap"
      - name: Prepare the isolated native browser
        if: matrix.target == 'browser'
        run: |
          npx playwright install --with-deps chromium
          node --import tsx --test tests/rome-date-time.test.ts
          node --import tsx tests/technical-assignments/provision-browser.ts
      - name: Native multiple assignments, work, private documents, uncertain results and revocation
        if: matrix.target == 'browser'
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3052 > "$TECHNICAL_EVIDENCE/app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3052/api/health >/dev/null; then ready=1; break; fi
            kill -0 "$app_pid"
            sleep 1
          done
          test "$ready" = 1
          PLAYWRIGHT_JSON_OUTPUT_NAME="$TECHNICAL_EVIDENCE/playwright.json" npx playwright test --config tests/technical-assignments/playwright.config.ts --reporter=line,json | tee "$TECHNICAL_EVIDENCE/browser.log"
          node -e 'const r=require(process.env.TECHNICAL_EVIDENCE+"/playwright.json"); if(r.stats.expected!==8 || r.stats.unexpected!==0 || r.stats.skipped!==0 || r.stats.flaky!==0 || r.errors.length!==0) process.exit(1)'
      - name: Bind final source and tree
        run: |
          git rev-parse HEAD HEAD^{tree} > "$TECHNICAL_EVIDENCE/source.txt"
          node -e 'const fs=require("node:fs"), assert=require("node:assert/strict"), cp=require("node:child_process"); const original=cp.execFileSync("git",["show","HEAD:next-env.d.ts"],{encoding:"utf8"}); assert([original,original.replaceAll("./.next/types/","./.next/dev/types/")].includes(fs.readFileSync("next-env.d.ts","utf8")))'
          git diff --exit-code -- . ':(exclude)next-env.d.ts'
          git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-assignments-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/technical-assignments
            ${{ runner.temp }}/technical-assignment-migration
            test-results
          if-no-files-found: error
          retention-days: 14
