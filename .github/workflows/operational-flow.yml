name: Operational lead flow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: operational-flow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qualify:
    name: Acquisition to PDF, calendars and recipient notices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: synthetic-flow-ci, POSTGRES_DB: fai_crm_test }
        ports: ['127.0.0.1:15479:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d fai_crm_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-flow-ci@127.0.0.1:15479/fai_crm_test?schema=public
      APP_ENV: test
      NODE_ENV: development
      TZ: UTC
      RUN_DB_TESTS: '1'
      AI_ORCHESTRATOR_DB_TESTS_CONFIRMED: '1'
      AI_ORCHESTRATOR_DB_TEST_SENTINEL: FAI_CRM_EPHEMERAL_TEST_ONLY_V1
      NEXT_TELEMETRY_DISABLED: '1'
      INTERNAL_SESSION_MODE: registry
      PRIVILEGED_ACCESS_MODE: enforced
      PRIVILEGED_STEP_UP_KEY_VERSION: '1'
      PRIVILEGED_STEP_UP_SECRET: synthetic-flow-ci-explicit-stepup-000000000000
      AUTH_SECRET: synthetic-flow-ci-local-login-000000000000
      AUTH_COOKIE_NAME: fai_setter_test
      APP_ORIGIN: http://localhost:3059
      COMMERCIAL_LEAD_INBOX_MODE: enforced
      LOGIN_THROTTLE_MODE: disabled
      SECURITY_HEADERS_MODE: report-only
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Bind exact source and empty isolated database
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir "$RUNNER_TEMP/flow-evidence"
          echo "FLOW_EVIDENCE=$RUNNER_TEMP/flow-evidence" >> "$GITHUB_ENV"
          echo "OPERATIONAL_DOCUMENT_EVIDENCE=$RUNNER_TEMP/flow-evidence/documents" >> "$GITHUB_ENV"
          echo "LOCAL_DOCUMENT_STORAGE_ROOT=$RUNNER_TEMP/flow-documents" >> "$GITHUB_ENV"
          node scripts/m4/verify-schema.mjs > "$RUNNER_TEMP/flow-evidence/binding.json"
          psql "${DATABASE_URL%%\?*}" -X -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE fai_crm_test IS 'FAI_CRM_EPHEMERAL_TEST_ONLY_V1'"
      - name: Preserve schema77 and qualify atomic additive schema78
        run: bash scripts/operational-flow/qualify-schema.sh
      - name: Role boundaries, unique receipts, preference races, calendar conflicts and PDF
        run: |
          set -euo pipefail
          node --import tsx --test --test-concurrency=1 --test-reporter=tap tests/operational-documents/persistence.ts tests/operational-documents/delivery.ts tests/personal-calendar-db.test.ts tests/workflow/persistence.ts tests/workflow/native-preparation-persistence.ts tests/workflow/newsletter-persistence.ts tests/workflow/operational-events-persistence.ts tests/operational-flow/persistence.ts | tee "$FLOW_EVIDENCE/database.tap"
          grep -qx '# fail 0' "$FLOW_EVIDENCE/database.tap"
          grep -qx '# cancelled 0' "$FLOW_EVIDENCE/database.tap"
          grep -qx '# skipped 0' "$FLOW_EVIDENCE/database.tap"
      - name: Real browser through synthetic role sessions
        run: |
          set -euo pipefail
          node --import tsx tests/operational-documents/provision.ts
          node --import tsx tests/operational-flow/prepare-browser.ts
          npx playwright install --with-deps chromium
          NODE_ENV=production npm run build > "$FLOW_EVIDENCE/build.log" 2>&1
          NODE_ENV=production node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3059 > "$FLOW_EVIDENCE/app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 10 http://localhost:3059/login > /dev/null; then break; fi
            kill -0 "$app_pid"
            sleep 1
          done
          PLAYWRIGHT_JSON_OUTPUT_NAME="$FLOW_EVIDENCE/documents.json" npx playwright test --config tests/operational-documents/playwright.config.ts --reporter=line,json --output "$FLOW_EVIDENCE/document-browser"
          PLAYWRIGHT_JSON_OUTPUT_NAME="$FLOW_EVIDENCE/calendars.json" npx playwright test --config tests/personal-calendar/playwright.config.ts --reporter=line,json --output "$FLOW_EVIDENCE/calendar-browser"
          node -e 'for(const f of ["documents","calendars"]){const {stats:s}=require(process.env.FLOW_EVIDENCE+"/"+f+".json");if(!s.expected||s.skipped||s.unexpected||s.flaky)process.exit(1)}'
          cp generated/operational-flow/proforma-sintetica.pdf "$FLOW_EVIDENCE/"
          cp generated/operational-flow/evidence.json "$FLOW_EVIDENCE/end-to-end.json"
          git rev-parse HEAD HEAD^{tree} > "$FLOW_EVIDENCE/source.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-flow-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/flow-evidence
          if-no-files-found: error
          retention-days: 14
