name: M4 approved manual communications
on: [pull_request]
permissions: { contents: read }
concurrency:
  group: m4-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: synthetic-m4-only, POSTGRES_DB: fai_crm_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d fai_crm_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
      browser-postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: synthetic-m4-only, POSTGRES_DB: fai_crm_test }
        ports: ['5433:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d fai_crm_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-m4-only@127.0.0.1:5432/fai_crm_test?schema=public
      R23_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      APP_ENV: test
      NODE_ENV: development
      AUTH_SECRET: synthetic-m4-browser-auth-not-production
      AUTH_COOKIE_NAME: fai_m4_browser_session
      APP_ORIGIN: http://127.0.0.1:3024
      PORT: '3024'
      INTERNAL_SESSION_MODE: registry
      LOGIN_THROTTLE_MODE: disabled
      PRIVILEGED_ACCESS_MODE: enforced
      PRIVILEGED_STEP_UP_KEY_VERSION: '1'
      COMMERCIAL_LEAD_INBOX_MODE: disabled
      RUN_DB_TESTS: '1'
      AI_ORCHESTRATOR_DB_TESTS_CONFIRMED: '1'
      AI_ORCHESTRATOR_DB_TEST_SENTINEL: FAI_CRM_EPHEMERAL_TEST_ONLY_V1
      M4_DB_CONFIRMED: '1'
      M4_BROWSER_CONFIRMED: '1'
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Bind schema49, preserve prefix48 and verify atomic failure before migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          echo "R23_MANUAL_EVIDENCE=$RUNNER_TEMP/r23-manuals-m4" >> "$GITHUB_ENV"
          evidence="$RUNNER_TEMP/m4-evidence"
          mkdir -p "$evidence"
          echo "M4_BROWSER_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          node scripts/m4/verify-schema.mjs > "$evidence/schema-binding.json"
          node --test tests/m4-schema-guard.test.mjs
          psql 'postgresql://postgres:synthetic-m4-only@127.0.0.1:5432/fai_crm_test' -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE fai_crm_test IS 'FAI_CRM_EPHEMERAL_TEST_ONLY_V1'"
          prior="$RUNNER_TEMP/m4-schema48"
          mkdir -p "$prior"
          git archive 9508d0da1b9642b02609d7431a984ced7b501e2e prisma | tar -x -C "$prior"
          node node_modules/prisma/build/index.js migrate deploy --schema "$prior/prisma/schema.prisma"
          test "$(psql 'postgresql://postgres:synthetic-m4-only@127.0.0.1:5432/fai_crm_test' -Atc 'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')" = 48
          psql 'postgresql://postgres:synthetic-m4-only@127.0.0.1:5432/fai_crm_test' -Atc 'SELECT migration_name,checksum FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name' > "$evidence/prefix48-before.txt"
          ddl=prisma/migrations/20260927010000_approved_manual_communications_v1/migration.sql
          test "$(head -1 "$ddl")" = 'BEGIN;'
          test "$(tail -1 "$ddl")" = 'COMMIT;'
          sed 's/^COMMIT;$/SELECT 1\/0;\nCOMMIT;/' "$ddl" > "$evidence/fault.sql"
          if psql 'postgresql://postgres:synthetic-m4-only@127.0.0.1:5432/fai_crm_test' -v ON_ERROR_STOP=1 -f "$evidence/fault.sql" > "$evidence/fault.log" 2>&1; then exit 1; fi
          grep -Fq 'division by zero' "$evidence/fault.log"
          test "$(psql 'postgresql://postgres:synthetic-m4-only@127.0.0.1:5432/fai_crm_test' -Atc "SELECT to_regclass('public.\"ApprovedCommunication\"') IS NULL")" = t
          npm run prisma:migrate:deploy
          psql 'postgresql://postgres:synthetic-m4-only@127.0.0.1:5432/fai_crm_test' -Atc 'SELECT migration_name,checksum FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name LIMIT 48' > "$evidence/prefix48-after.txt"
          cmp "$evidence/prefix48-before.txt" "$evidence/prefix48-after.txt"
          printf '{"synthetic":true,"before":48,"after":49,"failureAtomic":true,"prefix48Unchanged":true}\n' > "$evidence/migration-proof.json"
      - name: PostgreSQL approval, concurrency, revocation, privacy and reconciliation
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/m4/communications-db.test.ts | tee "$M4_BROWSER_EVIDENCE/database.tap"
          grep -Eq '^# pass [1-9][0-9]*$' "$M4_BROWSER_EVIDENCE/database.tap"
          grep -Fx '# fail 0' "$M4_BROWSER_EVIDENCE/database.tap"
          grep -Fx '# skipped 0' "$M4_BROWSER_EVIDENCE/database.tap"
      - name: Provision isolated browser database and masked synthetic credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in M4_BROWSER_PASSWORD PRIVILEGED_STEP_UP_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            export "$name=$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          export DATABASE_URL='postgresql://postgres:synthetic-m4-only@127.0.0.1:5433/fai_crm_test?schema=public'
          export LOCAL_DOCUMENT_STORAGE_ROOT="$RUNNER_TEMP/m4-browser-documents"
          printf 'DATABASE_URL=%s\nLOCAL_DOCUMENT_STORAGE_ROOT=%s\n' "$DATABASE_URL" "$LOCAL_DOCUMENT_STORAGE_ROOT" >> "$GITHUB_ENV"
          psql 'postgresql://postgres:synthetic-m4-only@127.0.0.1:5433/fai_crm_test' -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE fai_crm_test IS 'FAI_CRM_EPHEMERAL_TEST_ONLY_V1'"
          npm run prisma:migrate:deploy
          node --import tsx tests/m4/provision-browser.ts
      - name: Real Chromium approval and manual message path
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > "$M4_BROWSER_EVIDENCE/app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3024/api/health >/dev/null; then ready=1; break; fi
            kill -0 "$app_pid"
            sleep 1
          done
          test "$ready" = 1
          npx playwright test --config tests/m4/playwright.config.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m4-evidence/schema-binding.json
            ${{ runner.temp }}/m4-evidence/migration-proof.json
            ${{ runner.temp }}/m4-evidence/database.tap
            ${{ runner.temp }}/m4-evidence/browser-proof.json
            ${{ runner.temp }}/m4-evidence/app.log
            ${{ runner.temp }}/r23-manuals-m4
          if-no-files-found: error
          retention-days: 14
